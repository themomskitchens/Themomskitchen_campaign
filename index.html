<!DOCTYPE html>
<html>
<head>
<title>Food Corner Campaign</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f4f4f4;padding:20px;}
.container{max-width:500px;margin:auto;background:white;padding:20px;border-radius:10px;}
input,select,button{width:100%;padding:10px;margin:8px 0;}
button{background:#ff6600;color:white;border:none;}
.hidden{display:none;}
</style>
</head>
<body>

<div class="container">

<div id="customerSection">
<h2>🏆 Lucky Draw Registration</h2>
<input type="text" id="name" placeholder="Full Name">
<input type="text" id="mobile" placeholder="Mobile Number">
<input type="text" id="office" placeholder="Office">
<select id="preference">
<option value="">Veg/Non-Veg</option>
<option>Veg</option>
<option>Non-Veg</option>
</select>
<button onclick="register()">Register</button>
</div>

<div id="adminLogin" class="hidden">
<h2>Admin Login</h2>
<input type="password" id="adminPass" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="adminPanel" class="hidden">
<h2>Admin Panel</h2>
<input type="text" id="orderMobile" placeholder="Customer Mobile">
<input type="number" id="orderAmount" placeholder="Order Amount">
<button onclick="addOrder()">Add Order</button>

<hr>
<button onclick="pickWinner()">Pick Winner</button>
<p id="winner"></p>
</div>

</div>

<script>
const API_URL = "YOUR_WEB_APP_URL";

if (window.location.search.includes("admin=1")) {
document.getElementById("customerSection").style.display="none";
document.getElementById("adminLogin").classList.remove("hidden");
}

function register(){
fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"register",
name:document.getElementById("name").value,
mobile:document.getElementById("mobile").value,
office:document.getElementById("office").value,
preference:document.getElementById("preference").value
})
})
.then(res=>res.text())
.then(data=>alert(data));
}

function login(){
fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"adminLogin",
password:document.getElementById("adminPass").value
})
})
.then(res=>res.text())
.then(data=>{
if(data==="Success"){
document.getElementById("adminLogin").style.display="none";
document.getElementById("adminPanel").classList.remove("hidden");
}else{
alert("Wrong Password");
}
});
}

function addOrder(){
fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"addOrder",
mobile:document.getElementById("orderMobile").value,
amount:parseInt(document.getElementById("orderAmount").value)
})
})
.then(res=>res.text())
.then(data=>alert(data));
}

function pickWinner(){
fetch(API_URL,{
method:"POST",
body:JSON.stringify({action:"getData"})
})
.then(res=>res.json())
.then(rows=>{
let pool=[];
for(let i=1;i<rows.length;i++){
for(let j=0;j<rows[i][6];j++){
pool.push(rows[i]);
}
}
let random=pool[Math.floor(Math.random()*pool.length)];
document.getElementById("winner").innerHTML=
"🏆 "+random[0]+"<br>Office: "+random[2]+"<br>Entries: "+random[6];
});
}
</script>

</body>
</html>
