<!DOCTYPE html>
<html>
<head>
<title>Food Corner Corporate Lucky Draw</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f4f4f4;padding:20px;}
.container{max-width:500px;margin:auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px #ccc;}
input,select,button{width:100%;padding:10px;margin:8px 0;}
button{background:#ff6600;color:white;border:none;cursor:pointer;}
button:hover{background:#e65c00;}
.hidden{display:none;}
h2{text-align:center;}
</style>
</head>
<body>

<div class="container">

<!-- CUSTOMER SECTION -->
<div id="customerSection">
<h2>🏆 Lucky Draw Registration</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="mobile" placeholder="Mobile Number">
<input type="text" id="office" placeholder="Office / Building">

<select id="preference">
<option value="">Veg / Non-Veg</option>
<option>Veg</option>
<option>Non-Veg</option>
</select>

<button onclick="register()">Register</button>
</div>


<!-- ADMIN LOGIN -->
<div id="adminLogin" class="hidden">
<h2>🔐 Admin Login</h2>
<input type="password" id="adminPass" placeholder="Enter Password">
<button onclick="login()">Login</button>
</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">
<h2>⚙ Admin Panel</h2>

<h3>Add Order</h3>
<input type="text" id="orderMobile" placeholder="Customer Mobile">
<input type="number" id="orderAmount" placeholder="Order Amount">
<button onclick="addOrder()">Add Order</button>

<hr>

<h3>Pick Winner</h3>
<button onclick="pickWinner()">Generate Winner</button>
<p id="winnerResult"></p>
</div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxMhg19u7Dcfe905zZ2IJ1rKTQlFXnibrrGd0XBmuhftKlv7V0uX6-RC9jphKXII7Sd/exec";

// Admin mode detect
if (window.location.search.includes("admin=1")) {
document.getElementById("customerSection").style.display="none";
document.getElementById("adminLogin").classList.remove("hidden");
}

// REGISTER
function register(){

let name=document.getElementById("name").value;
let mobile=document.getElementById("mobile").value;
let office=document.getElementById("office").value;
let preference=document.getElementById("preference").value;

if(!name||!mobile||!office||!preference){
alert("Please fill all fields");
return;
}

fetch(API_URL,{
method:"POST",
mode:"cors",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
action:"register",
name:name,
mobile:mobile,
office:office,
preference:preference
})
})
.then(res=>res.text())
.then(data=>{
alert(data);
document.getElementById("name").value="";
document.getElementById("mobile").value="";
document.getElementById("office").value="";
document.getElementById("preference").value="";
})
.catch(err=>alert("Error: "+err));

}


// ADMIN LOGIN
function login(){
let pass=document.getElementById("adminPass").value;

fetch(API_URL,{
method:"POST",
mode:"cors",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
action:"adminLogin",
password:pass
})
})
.then(res=>res.text())
.then(data=>{
if(data==="Success"){
document.getElementById("adminLogin").style.display="none";
document.getElementById("adminPanel").classList.remove("hidden");
}else{
alert("Wrong Password");
}
});
}


// ADD ORDER
function addOrder(){
let mobile=document.getElementById("orderMobile").value;
let amount=parseInt(document.getElementById("orderAmount").value);

if(!mobile||!amount){
alert("Enter mobile & amount");
return;
}

fetch(API_URL,{
method:"POST",
mode:"cors",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
action:"addOrder",
mobile:mobile,
amount:amount
})
})
.then(res=>res.text())
.then(data=>alert(data));
}


// PICK WINNER
function pickWinner(){

fetch(API_URL,{
method:"POST",
mode:"cors",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({action:"getData"})
})
.then(res=>res.json())
.then(rows=>{

let pool=[];

for(let i=1;i<rows.length;i++){
let entries=parseInt(rows[i][6]);
for(let j=0;j<entries;j++){
pool.push(rows[i]);
}
}

if(pool.length===0){
alert("No Entries Found");
return;
}

let random=pool[Math.floor(Math.random()*pool.length)];

document.getElementById("winnerResult").innerHTML=
"🏆 Winner: "+random[0]+"<br>Office: "+random[2]+"<br>Total Entries: "+random[6];

})
.catch(err=>alert("Error: "+err));

}

</script>

</body>
</html>
